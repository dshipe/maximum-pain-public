<div class="ChartWrapper">
	<div #myChart class="ChartContainer NoMargin">
		<img src="assets/loadingDot.gif" />
	</div>
	<div class="table-responsive mt-3" *ngIf="tableData.length > 0">
		<table class="table table-sm table-striped">
			<thead>
				<tr>
					<th>Date</th>
					<th>Open</th>
					<th>High</th>
					<th>Low</th>
					<th>Close</th>
					<th>Volume</th>
				</tr>
			</thead>
			<tbody>
				<tr *ngFor="let row of tableData">
					<td>{{ row.date | date:'yyyy-MM-dd' }}</td>
					<td>{{ row.open | number:'1.2-2' }}</td>
					<td>{{ row.high | number:'1.2-2' }}</td>
					<td>{{ row.low | number:'1.2-2' }}</td>
					<td>{{ row.close | number:'1.2-2' }}</td>
					<td>{{ row.volume | number:'1.0-0' }}</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
