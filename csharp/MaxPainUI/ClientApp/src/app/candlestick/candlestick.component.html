<div class="container-fluid">
  <div class="row">
    <div class="col-12">&nbsp;</div>
  </div>
  <div class="row">
    <div class="col-12 col-sm-6 col-md-4">
      <app-adsense></app-adsense>
    </div>
    <div class="col-12 col-sm-6 col-md-4">
      <div class="mpShadow rounded border mpPadded">

        <!-- Search form -->
        <form [formGroup]="tickerForm">
          <table class="mpInputTable">
            <tr>
              <td>
                <div class="input-group input-group-lg">
                  <input type="text" class="form-control" formControlName="formTicker" (keydown)="onKeydown($event)" />
                  <div class="input-group-append">
                    <button class="btn btn-success" type="button" (click)="onSubmit($event)">
                      <i class="fa fa-check-circle"></i>
                    </button>
                  </div>
                  <div class="input-group-append">
                    <button class="btn btn-primary" type="button" (click)="onSearch($event)">
                      <i class="fa fa-search"></i>
                    </button>
                  </div>
                </div>
              </td>
            </tr>
            <tr>
              <td>
                <label for="startDate">Start Date:</label>
                <input type="text" class="form-control" id="startDate" placeholder="YYYY-MM-DD" formControlName="formStartDate" (change)="onDateRangeChange($event)" />
              </td>
            </tr>
            <tr>
              <td>
                <label for="numDays">Number of Days:</label>
                <input type="number" class="form-control" id="numDays" formControlName="formNumDays" min="1" (change)="onDateRangeChange($event)" />
              </td>
            </tr>
            <tr>
              <td>
                Please help support this website
                <a rel="nofollow" href="https://www.patreon.com/bePatron?u=47713673">
                  <button class="btn btn-primary center">Become a Patreon</button>
                </a>
              </td>
            </tr>
          </table>
        </form>

      </div>
    </div>
    <div class="col-12 col-sm-6 col-md-4">
      <div class="mpShadow rounded border mpPadded">
        <app-subscribe></app-subscribe>
      </div>
    </div>
  </div>

  <ng-template [ngIf]="hasError">
    <div class="alert alert-warning ErrorMessage" role="alert">
      <i class="fa-solid fa-warning"></i>&nbsp;&nbsp;
      No data returned for ticker {{tickerObj.Ticker}}
    </div>
  </ng-template>

  <ng-template [ngIf]="!hasError">
    <div class="row">
      <div class="col-12">
        <app-chartcandle [ticker]="ticker" [title]="ticker + ' Candlestick Chart'" [startDate]="startDate" [numDays]="numDays"></app-chartcandle>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div><span (click)="onClickDebug($event)">.</span></div>
        <div *ngIf="tickerObj" [hidden]="isDebugHidden">
          <pre style="background-color:#fc0; padding: 5px;">
ticker = {{ticker}}

tickerObj
{{tickerObj | json}}
          </pre>
        </div>
      </div>
    </div>

  </ng-template>
</div>
